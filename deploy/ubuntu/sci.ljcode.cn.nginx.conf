server {
    listen 80;
    server_name sci.ljcode.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/oracle-eclipse-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sci.ljcode.cn;

    ssl_certificate /etc/letsencrypt/live/sci.ljcode.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sci.ljcode.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ORACLE_ECLIPSE_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 30m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /source-materials/ {
        return 404;
    }

    location ^~ /data/release-history/ {
        return 404;
    }

    location ^~ /deploy/ {
        return 404;
    }

    location ^~ /tools/ {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }

    location ^~ /evaluation/ {
        return 404;
    }

    location ^~ /user-testing/ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(?:py|pyc|pyo|ps1|sh|md|docx|db|sqlite|sqlite3|log|err|env|ini|toml|yaml|yml)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8018;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 360s;
        proxy_read_timeout 360s;
        proxy_buffering off;
    }
}
